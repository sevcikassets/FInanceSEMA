services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_sema}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - finance-sema-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance_sema}"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finance_sema}
      # Must match the public origin the browser actually loads the app from
      # (the web container behind Traefik at https://${DOMAIN}), not the
      # dev-only http://localhost:3010 default from .env/API_CORS_ORIGINS -
      # otherwise every request from production gets rejected as CORS.
      API_CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
      APP_USERNAME: ${FINANCE_APP_USERNAME:?set FINANCE_APP_USERNAME in .env}
      APP_PASSWORD: ${FINANCE_APP_PASSWORD:?set FINANCE_APP_PASSWORD in .env}
      APP_TOKEN_SECRET: ${FINANCE_APP_TOKEN_SECRET:?set FINANCE_APP_TOKEN_SECRET in .env (e.g. openssl rand -hex 32)}
    volumes:
      - ./imports:/imports
      - ./exports:/app/exports
    labels:
      # These must live on the api container, not web - a Traefik service's
      # loadbalancer.server.port is resolved against whichever container
      # carries that label. Both routers' labels used to sit on web,
      # including this api one, so Traefik had two competing service
      # definitions with no way to tell finance-sema and finance-sema-api
      # apart ("cannot be linked automatically with multiple Services") and
      # silently dropped both routers - the domain 404'd even though DNS
      # and the containers were fine. traefik.http.routers.*.service pins
      # each router to its service explicitly so this can't recur.
      - "traefik.enable=true"
      - "traefik.http.routers.finance-sema-api.rule=Host(`${DOMAIN:?set DOMAIN in .env}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.finance-sema-api.entrypoints=websecure"
      - "traefik.http.routers.finance-sema-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.finance-sema-api.service=finance-sema-api"
      # Order matters: strip the /api prefix first, then rate-limit - a
      # generous cap (well above normal UI usage) that still blunts a
      # scripted brute-force run against /auth/login or /auth/2fa/login.
      - "traefik.http.routers.finance-sema-api.middlewares=finance-sema-api-strip,finance-sema-api-ratelimit"
      - "traefik.http.middlewares.finance-sema-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.finance-sema-api-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.finance-sema-api-ratelimit.ratelimit.burst=40"
      - "traefik.http.services.finance-sema-api.loadbalancer.server.port=8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?set DOMAIN in .env}/api
    restart: unless-stopped
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-sema.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.finance-sema.entrypoints=websecure"
      - "traefik.http.routers.finance-sema.tls.certresolver=letsencrypt"
      - "traefik.http.routers.finance-sema.service=finance-sema"
      - "traefik.http.services.finance-sema.loadbalancer.server.port=3000"
    networks:
      - default
      - proxy
    depends_on:
      - api

volumes:
  finance-sema-db:

networks:
  proxy:
    external: true
